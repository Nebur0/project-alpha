# Project Alpha — prova in avanti del satellite bitcoin con filtro di tendenza
# (docs/BITCOIN.md), in parallelo agli altri portafogli, capitale virtuale
# separato da 1.000. Conto interno: non tocca il conto Alpaca del core.
# Richiesta del proprietario del 2026-11-24 ("vai, creiamo un nuovo
# portafoglio"). Eccezione all'IPS solo per questa prova: un solo strumento,
# perdita massima 60%.
# Regola fissa: non si modifica guardando i risultati.

name = "bitcoin_trend_v1"
data = "data/raw/bars_bitcoin.csv"
log = "reports/paper_bitcoin/paper_log.csv"
state = "reports/paper_bitcoin/state.json"
broker = "ledger"
ledger = "data/paper_bitcoin/ledger.json"

budget = 1000.0

# -40% → solo riduzioni; -50% → tutto in cash e stop fino allo sblocco manuale.
stop_drawdown = 0.50
ips_max_drawdown = 0.60

drift_threshold = 0.05
exposure_threshold = 0.05

# IBIT (ETF spot su bitcoin, quotato a New York): 100% quando la chiusura è
# sopra la media delle ultime 200 sedute, altrimenti 100% liquidità.
[weights]
IBIT = 1.0

[groups]
IBIT = "cripto"

[trend_filter]
sma_days = 200

[risk]
max_position_weight = 1.0
max_gross_exposure = 1.0
max_group_weight = 1.0
max_daily_loss = 0.15
max_drawdown = 0.40
max_turnover = 2.0
max_data_age_days = 4.0
min_cash_weight = 0.0

[orders]
min_order_notional = 10.0
allow_fractional = true
fractional_decimals = 4
cash_buffer = 0.0
