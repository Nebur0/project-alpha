[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-alpha"
version = "0.1.0"
description = "Transparent quantitative trading research MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.3,<3",
  "pandas>=3.0,<4",
  "python-dotenv>=1.1,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
project-alpha = "project_alpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
